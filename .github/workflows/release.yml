name: Release
on:
  push:
    branches:
      - "collab-main"
  workflow_dispatch:

jobs:
  publish_windows:
    name: "Publish Windows"
    runs-on: windows-2022

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and release app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run release

  publish_linux:
    name: "Publish Linux x64"
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install libraries
        run:
          |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev --fix-missing

      - name: Install dependencies
        run: npm ci

      - name: Build and release app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

  # This needs it's own build
  # https://github.com/ChurchApps/FreeShow/issues/562
  publish_linux_arm:
    name: "Publish Linux arm64"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install libraries
        run:
          |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev --fix-missing

      # WIDEVINE
      # - name: Use stock Electron on ARM64
      #   run: npm run replace-electron

      - name: Install dependencies
        run: npm ci

      - name: Install FPM
        run:
          |
          sudo apt-get install ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      # wait because this will only publish if the draft exists
      - name: Sleep for 1.5 minute
        run: sleep 90s
        shell: bash

      - name: Build and release app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_SYSTEM_FPM: true
        run: npm run release:arm64

  # Headless web server. Independent of the desktop jobs: no Electron, no native
  # desktop modules, so it needs none of the libfontconfig/uuid/libltc packages.
  #
  # Every target is built on its own native runner so the smoke test actually
  # exercises the bundled runtime and the native sharp build it ships.
  publish_server:
    name: "Publish Server (${{ matrix.platform }}-${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-26-intel # Intel
            platform: macos
            arch: x64
          - runner: macos-latest # Apple silicon
            platform: macos
            arch: arm64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Package server
        run: npm run package:server:${{ matrix.platform }}-${{ matrix.arch }}

      # runs against the extracted tarball, so it covers the bundled Node runtime,
      # the relocated sharp install and the packaged asset paths
      - name: Smoke test the artifact
        run: npm run test:server-package

      # always available even if the release upload races with the desktop jobs' draft
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeshow-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/server/*.tar.gz
            dist/server/*.deb
          if-no-files-found: error

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # attach to the same draft release the desktop builds publish to (electron-builder
      # names it v<version>); softprops updates an existing draft rather than duplicating
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          draft: true
          files: |
            dist/server/*.tar.gz
            dist/server/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_mac:
    name: "Publish MacOS"
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Change Python version: https://github.com/nodejs/node-gyp/issues/2869
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This probably does not make any difference.
      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: npm ci

      - name: Install dmg-license
        run: npm i dmg-license

      # for some reason the build command don't continue after the rollup build
      - name: Sleep for 3 minutes
        run: sleep 180
        shell: bash

      - name: Build and release app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Temporarily disable signing until we can get a new certificate
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLETEAMID }}
        run: npm run release
